# Career-Ops — Canonical States
# Source of truth for career-ops (writer) and dashboard (reader).
# Both systems MUST use these exact states.
#
# Rule: The status field in applications.md may contain either:
# 1) a single canonical value, or
# 2) a status history chain using " > " separators
#    (example: Scored > PDF'd > Applied).
#
# Each token in the chain must be one of these canonical values
# (case-insensitive), with no markdown bold (**), dates, or extra text.

states:
  - id: evaluated
    label: Evaluated
    aliases: [evaluada]
    description: Offer evaluated with report, pending decision
    dashboard_group: evaluated

  - id: scored
    label: Scored
    aliases: [score, pipeline_score]
    description: CV scored (no full report generated)
    dashboard_group: evaluated

  - id: pdf
    label: PDF'd
    aliases: [pdfd, pdfed, pdf generated]
    description: Tailored PDF generated for this role
    dashboard_group: pdf

  - id: applied
    label: Applied
    aliases: [aplicado, enviada, aplicada, sent]
    description: Application submitted
    dashboard_group: applied

  - id: responded
    label: Responded
    aliases: [respondido]
    description: Company has responded (not yet interview)
    dashboard_group: responded

  - id: interview
    label: Interview
    aliases: [entrevista]
    description: Active interview process
    dashboard_group: interview

  - id: offer
    label: Offer
    aliases: [oferta]
    description: Offer received
    dashboard_group: offer

  - id: rejected
    label: Rejected
    aliases: [rechazado, rechazada]
    description: Rejected by company
    dashboard_group: rejected

  - id: discarded
    label: Discarded
    aliases: [descartado, descartada, cerrada, cancelada]
    description: Discarded by candidate or offer closed
    dashboard_group: discarded

  - id: inactive
    label: Inactive
    aliases: [inactive, expired, closed, dead]
    description: Job posting is no longer active (URL dead or role filled)
    dashboard_group: inactive

  - id: skip
    label: SKIP
    aliases: [no_aplicar, no aplicar, skip, monitor]
    description: Doesn't fit, don't apply
    dashboard_group: skip
